[build]
  base = "frontend"
  command = "corepack enable && corepack prepare pnpm@11.19.0 --activate && pnpm install --frozen-lockfile --dir=.. && pnpm --filter frontend build"
  publish = "../dist/frontend"

[build.environment]
  VITE_DATA_SOURCE = "http"

# Mesma regra do frontend/public/_redirects — repetida aqui porque o
# arquivo publicado (dist/frontend/_redirects) já cobre o deploy normal,
# mas o netlify.toml é a fonte de verdade quando o site é configurado via
# dashboard/CLI a partir do repositório.
[[redirects]]
  from = "/api/*"
  to = "https://sumi-ufcg-backend.onrender.com/api/:splat"
  status = 200
  force = true
